# The wheel imported cleanly for twelve releases while shipping no command at
# all, because `[project.scripts]` was absent and nothing the unit suite can
# reach knows whether a console script exists. It then shipped a quickstart
# that copied a config template the wheel did not contain, for the same
# reason: every unit test reads the templates off the source tree, where they
# have always been. Same failure mode one file over for the systemd unit --
# the unit is data, so only a real install proves `service install` can read
# it.
#
# So this does not stop at `--help`. It walks the documented first-run path
# against the installed artefact, which is the only place any of the three
# gaps is visible. It lives here rather than in each workflow because the
# release job must walk exactly what CI walked: a check that drifted between
# the two would pass on every pull request and fail on a version tag that
# cannot be reused.
name: Check the built wheel
description: Install the built wheel and walk the documented first run.

inputs:
  dist:
    description: Directory holding the built wheel.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Install the wheel and walk the documented first run
      shell: bash
      run: |
        set -o pipefail

        python -m venv /tmp/wheel-check
        /tmp/wheel-check/bin/pip install --quiet ${{ inputs.dist }}/*.whl
        /tmp/wheel-check/bin/pr-review-agent --help

        mkdir -p /tmp/wheel-run
        cd /tmp/wheel-run
        /tmp/wheel-check/bin/pr-review-agent config generate

        # A generated config must NOT be runnable: it names `owner/name`,
        # and a template that runs as shipped is a template that polls and
        # posts against somebody else's repository. Exit 3 is the contract.
        if /tmp/wheel-check/bin/pr-review-agent config validate; then
          echo "::error::The shipped template validates unedited."
          exit 1
        fi

        sed -i 's|owner/name|example/repo|' config.yaml
        /tmp/wheel-check/bin/pr-review-agent config validate

        /tmp/wheel-check/bin/pr-review-agent config generate --full --force
        sed -i 's|owner/name|example/repo|' config.yaml
        /tmp/wheel-check/bin/pr-review-agent config validate

        echo "OK: the installed wheel ships a template that must be edited."

    # XDG_* keeps the installed unit out of the runner's own home.
    - name: Install the wheel's systemd unit
      shell: bash
      run: |
        set -o pipefail

        export XDG_CONFIG_HOME=/tmp/unit-check/config
        export XDG_STATE_HOME=/tmp/unit-check/state
        export XDG_CACHE_HOME=/tmp/unit-check/cache
        /tmp/wheel-check/bin/pr-review-agent service install

        unit="$XDG_CONFIG_HOME/systemd/user/pr-review-agent.service"
        test -s "$unit"
        systemd-analyze --user verify "$unit" || {
          echo "::error::the shipped unit does not parse"; exit 1; }

        echo "OK: the installed wheel ships a unit systemd accepts."
