name: CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The supported range is proved on Linux; the two other platforms are
        # spot-checked on one version, since the package is pure Python and a
        # per-OS difference is far likelier than a per-version one.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap Poetry into the project venv
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install poetry
          echo "$PWD/$bin" >> "$GITHUB_PATH"

      - name: Confirm Poetry comes from the venv, not the system
        shell: bash
        run: |
          resolved=$(command -v poetry)
          case "$resolved" in
            "$PWD/.venv"/*) ;;
            *) echo "::error::poetry resolved to $resolved, not the project venv"; exit 1 ;;
          esac
          poetry --version

      - name: Install dependencies
        shell: bash
        run: poetry install --with dev

      - name: Run tests
        shell: bash
        run: poetry run pytest -q

  quality:
    name: Lint, type-check and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Bootstrap Poetry into the project venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install poetry
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: poetry install --with dev

      # `src tests scripts` rather than `.`: the gate should name what it
      # checks. `pyproject.toml`'s `extend-exclude` keeps a bare `ruff .` in
      # agreement, but the explicit list is what stops a future directory
      # being formatted to this project's rules by accident.
      - name: Check formatting
        run: poetry run ruff format --check src tests scripts

      - name: Run ruff
        run: poetry run ruff check src tests scripts

      - name: Run pylint on src (min score 9.0)
        run: poetry run pylint src --rcfile=.pylintrc --fail-under=9.0

      - name: Run pylint on tests (min score 9.0)
        run: >-
          poetry run pylint tests --rcfile=.pylintrc --fail-under=9.0
          --disable=missing-function-docstring,missing-module-docstring

      - name: Run pyright
        run: poetry run pyright src tests

      - name: Run tests with coverage
        run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

      # The lock file is what CI installs, so the lock file is what gets
      # audited -- frozen out of the venv rather than re-resolved, so this
      # answers "is what we just ran vulnerable" and not "would a fresh
      # resolution be". pip-audit goes in a venv of its own: installed
      # alongside the project it would audit its own dependency tree too,
      # and `--skip-editable` still fails `--strict` on this package.
      - name: Audit dependencies for known vulnerabilities
        run: |
          poetry run python -m pip freeze --exclude-editable > audit-requirements.txt
          .venv/bin/python -m venv .audit
          .audit/bin/python -m pip install --quiet --upgrade pip pip-audit
          .audit/bin/pip-audit --strict --desc --requirement audit-requirements.txt

  # The development container shipped for twelve releases with nothing but a
  # note in its own header saying CI did not build it, and DOCKER.md asking
  # the next person to verify it by hand. A break in `Dockerfile` or
  # `entrypoint.sh` was therefore found by whoever needed the container next,
  # which is the worst time. This does not re-run the whole gate inside the
  # image -- the `test` and `quality` jobs already did that on the host. It
  # proves the image builds, that PID 1 links the mounted checkout, and that
  # the linked package imports and runs under the container's interpreter.
  docker:
    name: Build the development container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # The account is a build arg with no default, for the reason
      # docker/.env.example gives: the entrypoint's editable install writes
      # into the mounted checkout, so a uid mismatch is a permission error
      # rather than a cosmetic one. Both args take the runner's `id -u`. The
      # gid deliberately does *not* take `id -g`: the runner's primary group
      # is `docker`, a low system gid the base image may already have spoken
      # for, and `groupadd` fails on that collision. The account owns the
      # files either way, which is what the editable install needs.
      - name: Read the runner's account
        id: account
        run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          tags: pr-review-agent-dev:ci
          load: true
          build-args: |
            PRA_USER=ci
            PRA_UID=${{ steps.account.outputs.uid }}
            PRA_GID=${{ steps.account.outputs.uid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the entrypoint against the checkout
        run: |
          docker run --rm -v "$PWD":/workspace pr-review-agent-dev:ci \
            bash -c 'python --version && git --version && claude --version'

      # The entrypoint's `pip install --editable` is the one step that cannot
      # happen at build time, so this is what proves it happened: an import
      # of the linked package and the console script the quickstart uses.
      - name: Prove the mounted checkout is importable and installed
        run: |
          docker run --rm -v "$PWD":/workspace pr-review-agent-dev:ci \
            bash -c 'pytest -q -x tests/test_compat.py && pr-review-agent --help'

  build:
    name: Build package
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Bootstrap Poetry into the project venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install poetry
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify the lock file matches pyproject.toml
        run: poetry check --lock

      - name: Build wheel and sdist
        run: poetry build

      - name: Reject direct-URL dependencies in built metadata
        run: |
          set -o pipefail

          wheel_metadata=$(unzip -p dist/*.whl '*.dist-info/METADATA')
          if [ -z "$wheel_metadata" ]; then
            echo "::error::Failed to extract wheel METADATA (empty output)."
            exit 1
          fi
          if echo "$wheel_metadata" | grep -E '^Requires-Dist:.*@ (file|git\+|https?)://'; then
            echo "::error::Built wheel has a direct-URL dependency (shown above)."
            exit 1
          fi

          sdist_metadata=$(tar -xOzf dist/*.tar.gz --wildcards '*/PKG-INFO')
          if [ -z "$sdist_metadata" ]; then
            echo "::error::Failed to extract sdist PKG-INFO (empty output)."
            exit 1
          fi
          if echo "$sdist_metadata" | grep -E '^Requires-Dist:.*@ (file|git\+|https?)://'; then
            echo "::error::Built sdist has a direct-URL dependency (shown above)."
            exit 1
          fi

          echo "OK: no direct-URL dependencies in wheel or sdist metadata."

      # The wheel imported cleanly for twelve releases while shipping no
      # command at all, because `[project.scripts]` was absent and nothing
      # the unit suite can reach knows whether a console script exists. It
      # then shipped a quickstart that copied a config template the wheel did
      # not contain, for the same reason: every unit test reads the templates
      # off the source tree, where they have always been. So this does not
      # stop at `--help`. It walks the documented first-run path against the
      # installed artefact, which is the only place either gap is visible.
      - name: Install the wheel and walk the documented first run
        run: |
          set -o pipefail

          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/pr-review-agent --help

          mkdir -p /tmp/wheel-run
          cd /tmp/wheel-run
          /tmp/wheel-check/bin/pr-review-agent config generate

          # A generated config must NOT be runnable: it names `owner/name`,
          # and a template that runs as shipped is a template that polls and
          # posts against somebody else's repository. Exit 3 is the contract.
          if /tmp/wheel-check/bin/pr-review-agent config validate; then
            echo "::error::The shipped template validates unedited."
            exit 1
          fi

          sed -i 's|owner/name|example/repo|' config.yaml
          /tmp/wheel-check/bin/pr-review-agent config validate

          /tmp/wheel-check/bin/pr-review-agent config generate --full --force
          sed -i 's|owner/name|example/repo|' config.yaml
          /tmp/wheel-check/bin/pr-review-agent config validate

          echo "OK: the installed wheel ships a template that must be edited."

      # Same failure mode one file over: the unit is data, so only a real
      # install proves `service install` can read it. XDG_* keeps it out of
      # the runner's own home.
      - name: Install the wheel's systemd unit
        run: |
          set -o pipefail

          export XDG_CONFIG_HOME=/tmp/unit-check/config
          export XDG_STATE_HOME=/tmp/unit-check/state
          export XDG_CACHE_HOME=/tmp/unit-check/cache
          /tmp/wheel-check/bin/pr-review-agent service install

          unit="$XDG_CONFIG_HOME/systemd/user/pr-review-agent.service"
          test -s "$unit"
          systemd-analyze --user verify "$unit" || {
            echo "::error::the shipped unit does not parse"; exit 1; }

          echo "OK: the installed wheel ships a unit systemd accepts."

      - name: Name the artefact after the version it contains
        id: dist
        run: |
          version=$(poetry version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload dist artefacts
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-review-agent-${{ steps.dist.outputs.version }}-dist
          path: dist
          # Long enough to investigate a failed run, and these are
          # reproducible from the tag anyway.
          retention-days: 14
          if-no-files-found: error
