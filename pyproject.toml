[project]
name = "pr-review-agent"
version = "0.12.1"
description = "Locally-hosted LLM-based PR review agent with enforced usage budgets"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The INTO-CPS Association" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/prasadtalasila/pr-review-agent"

# Without this the wheel ships the package and no command: `pip install` puts
# `pr_review_agent` on the path and nothing in `bin/`, so an operator who
# installed the released artefact had `python -m pr_review_agent.daemon` and
# no `pr-review-agent`. The module stays runnable either way.
[project.scripts]
pr-review-agent = "pr_review_agent.daemon:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pr_review_agent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
pylint = "^3.3"
pyright = "^1.1"
pytest-asyncio = "^0.24"
cryptography = ">=42"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The client and poller are asyncio-native; every async test in the suite
# wants the default event loop, so marking each one individually is noise.
asyncio_mode = "auto"
# A `live` test runs a real coding agent and spends real tokens, so it is
# deselected by default and never runs in CI. `-m live` opts in.
addopts = ["-m", "not live"]
markers = ["live: runs a real engine binary and spends tokens; opt in with -m live"]

[tool.coverage.run]
source = ["src/pr_review_agent"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
