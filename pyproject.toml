[project]
name = "pr-review-agent"
version = "0.18.0"
description = "Locally-hosted LLM-based PR review agent with enforced usage budgets"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prasad Talasila" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "click>=8.1,<9",
]

# PyPI renders these as the sidebar links, which is the only navigation a
# reader of the project page gets: the README's own links were relative for
# sixteen releases and every one of them resolved against `pypi.org` and
# 404'd.
[project.urls]
Homepage = "https://prasad.talasila.in/pr-review-agent/"
Documentation = "https://prasad.talasila.in/pr-review-agent/"
Repository = "https://github.com/prasadtalasila/pr-review-agent"
Releases = "https://github.com/prasadtalasila/pr-review-agent/releases"

# Without this the wheel ships the package and no command: `pip install` puts
# `pr_review_agent` on the path and nothing in `bin/`, so an operator who
# installed the released artefact had `python -m pr_review_agent.daemon` and
# no `pr-review-agent`.
[project.scripts]
pr-review-agent = "pr_review_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pr_review_agent", from = "src" }]
# The config templates are data, not code, so nothing would pull them into the
# distribution on its own -- and for thirteen releases nothing did, leaving a
# quickstart that told the operator to copy a file the wheel had never
# contained. `config generate` reads them from here.
# `service install` reads the unit from here for the same reason.
include = [
    { path = "src/pr_review_agent/templates/*.yaml", format = "sdist" },
    { path = "src/pr_review_agent/templates/*.yaml", format = "wheel" },
    { path = "src/pr_review_agent/templates/*.service", format = "sdist" },
    { path = "src/pr_review_agent/templates/*.service", format = "wheel" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
pylint = "^3.3"
pyright = "^1.1"
pytest-asyncio = "^0.24"
cryptography = ">=42"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.7,<10.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The client and poller are asyncio-native; every async test in the suite
# wants the default event loop, so marking each one individually is noise.
asyncio_mode = "auto"
# A `live` test runs a real coding agent and spends real tokens, so it is
# deselected by default and never runs in CI. `-m live` opts in.
addopts = ["-m", "not live"]
markers = ["live: runs a real engine binary and spends tokens; opt in with -m live"]

[tool.coverage.run]
source = ["src/pr_review_agent"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
