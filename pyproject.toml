[tool.poetry]
name = "pr-review-agent"
version = "0.0.1"
description = "Locally-hosted LLM-based PR review agent with enforced usage budgets"
authors = ["The INTO-CPS Association"]
license = "MIT"
readme = "README.md"
packages = [{ include = "pr_review_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
PyYAML = "^6.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
pylint = "^3.3"
pyright = "^1.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/pr_review_agent"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
