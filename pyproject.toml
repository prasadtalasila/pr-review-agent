[project]
name = "pr-review-agent"
version = "0.2.0"
description = "Locally-hosted LLM-based PR review agent with enforced usage budgets"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The INTO-CPS Association" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/prasadtalasila/pr-review-agent"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pr_review_agent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
pylint = "^3.3"
pyright = "^1.1"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The client and poller are asyncio-native; every async test in the suite
# wants the default event loop, so marking each one individually is noise.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pr_review_agent"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
