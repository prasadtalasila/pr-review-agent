# Copy to config.yaml and edit. config.yaml is gitignored: it names real
# accounts and, later, will sit beside the agent's credentials.

github:
  # The repository to poll. Reviews are posted here.
  repo: INTO-CPS-Association/DTaaS

  # The numeric id of the account the agent posts as. Its own comments are
  # then ignored, so a posted review can never re-trigger a review.
  # Fill this in once the reviewer account exists on the host.
  agent_user_id: null

triggers:
  # The handle that summons a review: "@claude review this".
  handle: claude

  # Numeric GitHub user ids, never logins. A login can be renamed and the
  # freed name registered by somebody else, which would hand eligibility to
  # a stranger. Look an id up with:
  #     curl -s https://api.github.com/users/<login> | grep '"id"'
  allowlist:
    - 114395272  # 8ohamed (Mohamed Abdulkarim)

store:
  # The SQLite file holding watermarks, ETags and the review queue. Optional;
  # this is the default. A relative path is resolved against the working
  # directory the daemon starts in, so prefer an absolute path under a
  # service account's data directory in production: pointing at the wrong
  # file costs the queue's memory of what has already been reviewed.
  path: state.db

budget:
  # The spending rails. Nothing reaches a review engine except through them.
  #
  # false is the emergency brake: it STOPS REVIEWING. It does not turn the
  # budget checks off. Takes effect on SIGHUP, without a restart.
  enabled: true

  # Your estimate of the PLAN's limits, in tokens. A subscription publishes
  # no quota, so these are guesses and there are deliberately no defaults --
  # a made-up spending ceiling is worse than being asked for one.
  #
  # Set them CONSERVATIVELY LOW. Until the circuit breaker lands with the
  # engine adapter, nothing detects an over-estimate: the governor will
  # report healthy utilisation while the real limit is already being hit.
  session_tokens: 88000      # rolling 5-hour window
  weekly_tokens: 1500000     # rolling 7-day window

  # Reserved up front for every run, and released down to actual usage when
  # the run settles. Must fit inside the daily allowance, which is a seventh
  # of the weekly one.
  max_run_tokens: 60000

  # The share of each plan window the agent may use, never the whole
  # allowance. This is what stops a runaway agent locking you out of your own
  # interactive Claude Code sessions: its ceiling is deliberately below the
  # plan's. Optional; 40 is the default.
  reviewer_share_pct: 40

  # Layer 2's diff-size caps. A pull request over either is refused before
  # anything is fetched. Both exist because neither bounds the other: 2000
  # one-line files pass a line cap and still bury the engine, and one
  # 50000-line generated file passes a file cap.
  #
  # These bound what the REVIEWER READS, not the disk: a fetch pulls every
  # object reachable from the head, so a commit that adds a large blob and a
  # later one that deletes it still downloads it. Optional; these are the
  # defaults, and they reload on SIGHUP with the rest of this section.
  max_changed_files: 100
  max_changed_lines: 5000

workspace:
  # Where the bare mirror and the per-run checkouts live, created 0700.
  # Optional; this is the default. Resolved against the working directory
  # the daemon starts in, so prefer an absolute path under a service
  # account's data directory in production. Unlike the budget section this
  # is NOT reloaded on SIGHUP: moving the cache under a running daemon
  # would orphan the mirror.
  cache_dir: .cache/repos
